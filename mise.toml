


# setting up container tasks, this is done before container is made, left for ref
[tasks.install-podman]
description = "Install Podman and docker compatibility packages"
run = """
sudo apt-get update
sudo apt-get install -y \
  podman \
  podman-docker \
  uidmap \
  slirp4netns \
  fuse-overlayfs
"""

[tasks.enable-podman]
description = "Enable Podman socket and create Docker-compatible symlink"
run = """
systemctl --user enable --now podman.socket

# Wait briefly for socket to appear
sleep 1

PODMAN_SOCK="${XDG_RUNTIME_DIR}/podman/podman.sock"

if [ ! -S "$PODMAN_SOCK" ]; then
  echo "ERROR: Podman socket not found at $PODMAN_SOCK"
  exit 1
fi

sudo mkdir -p /var/run
sudo ln -sf "$PODMAN_SOCK" /var/run/docker.sock
"""

